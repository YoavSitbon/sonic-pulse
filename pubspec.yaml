name: sonic_pulse
description: A Flutter application for guitar/chord recognition.

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.1
  record: ^5.1.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.4

dependency_overrides:
  # record_linux 0.7.2 is missing startStream.
  # record_linux >= 2.0.0 requires Dart >= 3.12.0.
  # 1.3.1 works with Dart 3.11 and implements startStream.
  record_linux: ^1.3.1

flutter:
  uses-material-design: true